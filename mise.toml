# SPDX-License-Identifier: MIT
#:schema https://mise.jdx.dev/schema/mise.json

[task_config]
includes = ["tools"]

[tools]
python = "3.12.13"
usage = "7.1.4"
uv = "0.11.21"

[hooks]
postinstall = "uv sync"

[tasks.test]
description = "Run offline unit test suite (no hardware required)"
run = "uv run pytest tests/unit"

[tasks."test:hardware"]
description = "Run live hardware integration test suite (requires connected Opal C1)"
run = "uv run pytest tests/hardware -m hardware"

[tasks."test:all"]
description = "Run complete test suite (unit + hardware)"
run = "uv run pytest"

[tasks."companion:build"]
description = "Build the Swift companion package (OpalC1Core + OpalC1UI dylib + OpalC1Companion)"
run = "swift build --package-path companion"

[tasks."companion:test"]
description = "Run OpalC1Core 4K VideoToolbox decode benchmark against test bitstream"
run = "swift build --package-path companion && companion/.build/debug/OpalC1TestRunner"

[tasks."companion:package"]
description = "Package OpalC1Ark.app bundle with embedded CMIOExtension"
run = "python tools/package_app.py"

[tasks."ui:mockup"]
description = "Run interactive v0 Menu Bar Extra mockup with animated demo tour"
run = "swift build --package-path companion && uv run python tools/mockup_v0_ui.py"

[tasks."ui:live"]
description = "Run v0 Menu Bar Extra with live Opal C1 telemetry polling"
run = "swift build --package-path companion && uv run python tools/mockup_v0_ui.py --live"
