[project]
name = "opal-c1-ark"
version = "0.1.0"
description = "Offline firmware archive, v0.0.29 USB bootloader upgrade, and SPI flash diagnostic toolkit for the Opal C1 webcam"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "depthai>=2.28,<3.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests requiring physical Opal C1 / DepthAI hardware connected over USB",
    "offline: tests that run purely in memory without USB hardware",
]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
